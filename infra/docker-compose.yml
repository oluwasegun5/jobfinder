name: jobfinder

services:
  postgres:
    # Tag and digest of the image this was tested with; bump both together.
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobfinder} -d ${POSTGRES_DB:-jobfinder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jobfinder}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # NOTE: MinIO's Docker images (minio/minio, minio/mc) were pulled from public
  # registries by MinIO Inc. and now require a paid subscription to pull, so the
  # PLAN.md §4 choice of "MinIO" is not obtainable as a free container image.
  # Substituted with Adobe S3Mock, a free, open-source, S3-API-compatible server
  # meant for exactly this (local dev/test object storage). See docs/adr/0009-local-object-storage.md.
  # No built-in healthcheck: the Paketo buildpack base this image ships on has
  # no wget/curl to probe with, so object-storage-init below polls it instead.
  object-storage:
    image: adobe/s3mock:5.2.3
    environment:
      debug: "false"
    ports:
      - "127.0.0.1:${OBJECT_STORAGE_PORT:-9000}:9090"

  object-storage-init:
    image: amazon/aws-cli:2.37.4
    depends_on:
      object-storage:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env (see .env.example)}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env (see .env.example)}
      AWS_EC2_METADATA_DISABLED: "true"
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-jobfinder}
    entrypoint: >
      /bin/sh -c "
      for i in $(seq 1 30); do
        aws --endpoint-url http://object-storage:9090 --region us-east-1 s3api head-bucket --bucket $$OBJECT_STORAGE_BUCKET >/dev/null 2>&1 && exit 0;
        aws --endpoint-url http://object-storage:9090 --region us-east-1 s3 mb s3://$$OBJECT_STORAGE_BUCKET && exit 0;
        sleep 2;
      done;
      echo 'object-storage did not become ready in time' >&2;
      exit 1
      "
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  core-api:
    build:
      context: ../services/core-api
      dockerfile: ../../infra/docker/core-api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
      # Not needed to start; CV parsing retries until it answers.
      ai-service:
        condition: service_started
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-jobfinder}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (see .env.example)}
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env (see .env.example)}
      # The pinned embedding space; ai-service gets the same two values (docs/adr/0022-embeddings-pipeline.md).
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake-embed-1024}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      # AI usage ledger and per-user daily cap (docs/adr/0025-ai-usage-ledger.md).
      AI_DAILY_CAP_CREDITS: ${AI_DAILY_CAP_CREDITS:-500}
      AI_MICRO_USD_PER_CREDIT: ${AI_MICRO_USD_PER_CREDIT:-1000}
      # The matching engine and its nightly run (docs/adr/0026-matching-engine.md).
      MATCHING_BATCH_ENABLED: ${MATCHING_BATCH_ENABLED:-true}
      MATCHING_BATCH_CRON: ${MATCHING_BATCH_CRON:-0 30 2 * * *}
      # Digests, instant alerts and unsubscribe links (docs/adr/0028-notifications.md).
      NOTIFICATIONS_DIGEST_ENABLED: ${NOTIFICATIONS_DIGEST_ENABLED:-true}
      NOTIFICATIONS_DIGEST_CRON: ${NOTIFICATIONS_DIGEST_CRON:-0 5 * * * *}
      NOTIFICATIONS_INSTANT_ENABLED: ${NOTIFICATIONS_INSTANT_ENABLED:-true}
      NOTIFICATIONS_UNSUBSCRIBE_SECRET: ${NOTIFICATIONS_UNSUBSCRIBE_SECRET:-}
      NOTIFICATIONS_MAIL_FROM: ${NOTIFICATIONS_MAIL_FROM:-no-reply@jobfinder.local}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      # core-api talks to the object store over the compose network; browsers get pre-signed URLs
      # that point at the published port instead.
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9090
      OBJECT_STORAGE_PUBLIC_ENDPOINT: http://localhost:${OBJECT_STORAGE_PORT:-9000}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-jobfinder}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?set OBJECT_STORAGE_ACCESS_KEY in .env (see .env.example)}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?set OBJECT_STORAGE_SECRET_KEY in .env (see .env.example)}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (see .env.example)}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Job aggregator keys (docs/adr/0021-aggregator-adapters.md). Blank: that source is registered but skipped.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      JSEARCH_RAPIDAPI_KEY: ${JSEARCH_RAPIDAPI_KEY:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Source alerts (docs/adr/0024-source-dashboard-alerts.md): comma-separated admin emails; blank only logs them.
      INGESTION_ALERT_RECIPIENTS: ${INGESTION_ALERT_RECIPIENTS:-}
      # Observability (docs/adr/0039-observability.md): JSON logs with trace ids; spans are exported only when
      # OTEL_TRACING_EXPORT=true (make observability-up sets it and starts the collector); Sentry only with a DSN.
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ${CORE_API_LOG_FORMAT:-ecs}
      OTEL_TRACING_EXPORT: ${OTEL_TRACING_EXPORT:-false}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY:-1.0}
      SENTRY_DSN: ${CORE_API_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
      SERVER_PORT: 8080
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  ai-service:
    build:
      context: ../services/ai-service
      dockerfile: ../../infra/docker/ai-service.Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:?set AI_SERVICE_TOKEN in .env (see .env.example)}
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_WORKSPACE_ID: ${ANTHROPIC_WORKSPACE_ID:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-claude-haiku-4-5}
      LLM_MODEL_STRONG: ${LLM_MODEL_STRONG:-claude-sonnet-5}
      # Label of the price list in app/config.py (LLM_PRICING); bump it when a price changes (ADR 0025).
      LLM_PRICING_VERSION: ${LLM_PRICING_VERSION:-2026-10-01}
      # Embeddings: keyless fake vectors by default; EMBEDDING_PROVIDER=voyage plus a key for real ones.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-fake-embed-1024}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      CORE_API_BASE_URL: http://core-api:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-jobfinder}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env (see .env.example)}
      # Observability (docs/adr/0039-observability.md), as for core-api.
      LOG_FORMAT: ${AI_SERVICE_LOG_FORMAT:-json}
      OTEL_TRACING_EXPORT: ${OTEL_TRACING_EXPORT:-false}
      OTEL_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT:-http://tempo:4318/v1/traces}
      TRACING_SAMPLE_PROBABILITY: ${TRACING_SAMPLE_PROBABILITY:-1.0}
      SENTRY_DSN: ${AI_SERVICE_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    # Internal only (PLAN.md §3): published on localhost for local debugging, never publicly.
    ports:
      - "127.0.0.1:${AI_SERVICE_PORT:-8000}:8000"

  web:
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        # The Next server proxies /api/core/* here; baked in at build (docs/adr/0011-web-core-api-access.md).
        CORE_API_URL: http://core-api:8080
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      # Observability (docs/adr/0039-observability.md): the Next server joins the trace and starts it for browser
      # calls. Spans are exported only when OTEL_TRACING_EXPORT=true; Sentry only with a DSN.
      OTEL_SERVICE_NAME: web
      OTEL_TRACING_EXPORT: ${OTEL_TRACING_EXPORT:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://tempo:4318}
      SENTRY_DSN: ${WEB_SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-local}
    ports:
      - "${WEB_PORT:-3000}:3000"

  # --- Observability (docs/adr/0039-observability.md). Behind a profile so the default stack stays small:
  # `make observability-up` (or `docker compose --profile observability up -d`). Everything binds to localhost.

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.8.2
    # Local only: a fresh tmpfs is root-owned, and the image's own user (10001) cannot write to it.
    user: "0"
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      # Traces are a development aid here: kept in memory, gone with the container.
      - type: tmpfs
        target: /var/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"

  prometheus:
    profiles: [observability]
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # The scrape endpoints of core-api and ai-service answer only to the service token.
    secrets:
      - ai_service_token
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [observability]
    image: grafana/grafana:12.4.12
    depends_on:
      - prometheus
      - tempo
    environment:
      # Local use only (bound to localhost): no login. Production dashboards are P6.5's concern.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

secrets:
  ai_service_token:
    environment: AI_SERVICE_TOKEN

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
