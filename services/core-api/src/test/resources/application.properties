app.ingestion.seed.enabled=false
# The nightly matching batch is started by tests directly, never by the clock.
app.matching.batch.enabled=false
# The digest and instant jobs are started by tests directly, never by the clock.
app.notifications.digest.enabled=false
app.notifications.instant.enabled=false
# The reminder job is started by tests directly, never by the clock.
app.applications.reminders.enabled=false
# No test context may run a source on the clock: contexts are cached and share one database and one shedlock table, so
# a scheduler that fired in another context would hold the lock a test needs for runNow (flaky "No value present").
app.ingestion.scheduler.poll-interval-ms=3600000
app.ingestion.scheduler.initial-delay-ms=3600000
# The billing jobs (monthly free grant, subscription expiry) are started by tests directly, never by the clock.
app.billing.jobs.enabled=false
# Production rate-limit defaults are never weakened. The suites share one Redis and some call an endpoint class many
# times as one user or from the one MockMvc address, so every endpoint class gets a ceiling no suite reaches. Tests of the
# limits themselves override a single class with @TestPropertySource (see EndpointRateLimitTests).
app.rate-limit.endpoints.AI.capacity=1000000
app.rate-limit.endpoints.AI.period=1h
app.rate-limit.endpoints.UPLOAD.capacity=1000000
app.rate-limit.endpoints.UPLOAD.period=1h
app.rate-limit.endpoints.DOWNLOAD.capacity=1000000
app.rate-limit.endpoints.DOWNLOAD.period=1h
app.rate-limit.endpoints.SEARCH.capacity=1000000
app.rate-limit.endpoints.SEARCH.period=1h
app.rate-limit.endpoints.DATA_EXPORT.capacity=1000000
app.rate-limit.endpoints.DATA_EXPORT.period=1h
app.rate-limit.endpoints.EXPORT.capacity=1000000
app.rate-limit.endpoints.EXPORT.period=1h
app.rate-limit.endpoints.EXTENSION.capacity=1000000
app.rate-limit.endpoints.EXTENSION.period=1h
app.rate-limit.endpoints.ADMIN_ACTION.capacity=1000000
app.rate-limit.endpoints.ADMIN_ACTION.period=1h
app.rate-limit.endpoints.PUBLIC_LINK.capacity=1000000
app.rate-limit.endpoints.PUBLIC_LINK.period=1h
app.rate-limit.endpoints.WEBHOOK.capacity=1000000
app.rate-limit.endpoints.WEBHOOK.period=1h
app.rate-limit.endpoints.API_READ.capacity=1000000
app.rate-limit.endpoints.API_READ.period=1h
app.rate-limit.endpoints.API_WRITE.capacity=1000000
app.rate-limit.endpoints.API_WRITE.period=1h

# Ingestion tests point the clients at WireMock on localhost; production keeps the strict defaults (ADR 0037).
app.security.ssrf.allow-http=true
app.security.ssrf.allow-private-addresses=true
app.retention.enabled=false
