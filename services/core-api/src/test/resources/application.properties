app.ingestion.seed.enabled=false
# The nightly matching batch is started by tests directly, never by the clock.
app.matching.batch.enabled=false
# The digest and instant jobs are started by tests directly, never by the clock.
app.notifications.digest.enabled=false
app.notifications.instant.enabled=false
# The reminder job is started by tests directly, never by the clock.
app.applications.reminders.enabled=false
# No test context may run a source on the clock: contexts are cached and share one database and one shedlock table, so
# a scheduler that fired in another context would hold the lock a test needs for runNow (flaky "No value present").
app.ingestion.scheduler.poll-interval-ms=3600000
app.ingestion.scheduler.initial-delay-ms=3600000
# The billing jobs (monthly free grant, subscription expiry) are started by tests directly, never by the clock.
app.billing.jobs.enabled=false
