# Live Spring test contexts at once (ADR 0038). Every context shares one set of containers but keeps its own
# Hikari pool (10), RabbitMQ connections and Redis database on them: 12 contexts stay well under the shared
# Postgres max_connections (200) and the 64 Redis databases, and bound the JVM heap. A context evicted from the
# cache is closed; reloading it costs only Spring startup, since the containers are already running.
spring.test.context.cache.maxSize=12
