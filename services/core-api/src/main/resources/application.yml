spring:
  application:
    name: core-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:jobfinder}
    username: ${POSTGRES_USER:jobfinder}
    # No default on purpose: startup fails unless POSTGRES_PASSWORD is set.
    password: ${POSTGRES_PASSWORD}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      # A mail server that stops answering must not hold up a request or an ingestion run (source alerts are sent
      # from the run's thread).
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:jobfinder}
    # No default on purpose: startup fails unless RABBITMQ_PASSWORD is set.
    password: ${RABBITMQ_PASSWORD}
    # Uploads publish to the broker; fail fast (the resume is then marked FAILED) instead of hanging.
    connection-timeout: 3s
    listener:
      simple:
        # A parse takes seconds (LLM call): one message at a time per consumer.
        prefetch: 1
        concurrency: 2
        # A message that blows up is dead-lettered, never redelivered in a loop.
        default-requeue-rejected: false
  servlet:
    multipart:
      # Headroom over app.resumes.max-size so oversized CVs get our own 413 with a clear message;
      # this only bounds what the container will buffer.
      max-file-size: 6MB
      max-request-size: 7MB

server:
  port: ${SERVER_PORT:8080}

app:
  auth:
    jwt:
      # No default on purpose: startup fails unless JWT_SECRET (>= 32 chars) is set.
      secret: ${JWT_SECRET:}
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}
    google:
      # OAuth client ID of the web app. Blank disables POST /auth/google (503).
      client-id: ${GOOGLE_CLIENT_ID:}
    admin:
      # Optional bootstrap admin: promoted if the account exists, created (verified) if a password is given.
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    refresh-cookie:
      # Secure cookies are still accepted on http://localhost by browsers; only turn off for odd setups.
      secure: ${AUTH_COOKIE_SECURE:true}
  rate-limit:
    redis-uri: redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
  storage:
    # S3-compatible: S3Mock locally, Cloudflare R2 in production. No key defaults on purpose:
    # startup fails unless OBJECT_STORAGE_ACCESS_KEY / OBJECT_STORAGE_SECRET_KEY are set.
    endpoint: ${OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    # Host browsers use in pre-signed URLs, when it differs from the endpoint core-api talks to.
    public-endpoint: ${OBJECT_STORAGE_PUBLIC_ENDPOINT:}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET:jobfinder}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY:}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY:}
    path-style: ${OBJECT_STORAGE_PATH_STYLE:true}
  upload:
    # Virus scanning of every upload, before it is stored or parsed (docs/adr/0037-security-hardening.md). none = no-op
    # adapter (development and tests); clamav = stream to a clamd daemon (INSTREAM over TCP). on-error is what happens
    # when the scanner cannot answer: closed (default, production) refuses the upload, open logs and accepts it.
    scanner:
      type: ${UPLOAD_SCANNER_TYPE:none}
      host: ${UPLOAD_SCANNER_HOST:localhost}
      port: ${UPLOAD_SCANNER_PORT:3310}
      on-error: ${UPLOAD_SCANNER_ON_ERROR:closed}
  resumes:
    max-size: 5MB
    max-per-user: 10
    download-url-ttl: 5m
    parsing:
      queue: resumes.parse
      dead-letter-queue: resumes.parse.dlq
      # Transient failures (ai-service or LLM down) are retried this many times in total, doubling the wait.
      max-attempts: 3
      initial-backoff: 2s
  ai-service:
    # Internal only (PLAN.md section 3). No token default on purpose: startup fails without AI_SERVICE_TOKEN.
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    token: ${AI_SERVICE_TOKEN:}
    connect-timeout: 2s
    # A parse is one LLM call (plus at most one validation retry) on a long CV.
    read-timeout: 90s
  ingestion:
    scheduler:
      # Set false to stop sources being picked up on schedule (manual runs still work).
      enabled: true
      # How often the scheduler looks for due sources, and how long it waits after startup.
      poll-interval-ms: 60000
      initial-delay-ms: 60000
    # How long a crashed instance can keep a source locked. Must exceed the longest real run.
    lock-at-most-for: 30m
    # Per-source overrides live in sources.config: intervalMinutes, jitterSeconds, requestsPerSecond,
    # retryMaxAttempts.
    defaults:
      interval-minutes: 360
      jitter-seconds: 900
      requests-per-second: 2
      retry-max-attempts: 3
      retry-initial-backoff: 1s
      rate-limit-timeout: 30s
      breaker-failure-rate-threshold: 50
      breaker-minimum-calls: 5
      breaker-open-duration: 5m
    # Source alerts (docs/adr/0024-source-dashboard-alerts.md): an email to these admins when a source returns no
    # jobs after returning some, or more than error-rate-threshold of a run's targets fail. A blank list (the
    # default) only logs the alert.
    alerts:
      recipients: ${INGESTION_ALERT_RECIPIENTS:}
      from: no-reply@jobfinder.local
      web-base-url: ${WEB_BASE_URL:http://localhost:3000}
      error-rate-threshold: 0.2
      # A run of fewer targets than this only counts when every target failed.
      error-rate-min-targets: 5
      # An empty run is a drop to zero only if the previous clean run fetched at least this many postings.
      zero-jobs-min-previous: 5
      # A source that stays in breach is announced again after this long; 0 announces it once.
      re-alert-interval: 24h
    # PLAN.md section 6 expiry: a full-listing source's job missing for this many consecutive runs, or an
    # aggregator job not seen for this long, is expired (once none of its listings is left).
    expiry:
      missed-runs: 2
      aggregator-stale-after: 45d
    # Aggregator adapters (ADR 0021). A blank key leaves the source registered but skipped, with the reason
    # logged at startup. Keys come from the environment only; never put one in this file.
    # Quota levers per source: max-pages-per-target, max-requests-per-day, min-request-interval, and the run
    # frequency (intervalMinutes in the source's sources.config; see seed-targets.json). The defaults keep each
    # source inside its free tier.
    aggregators:
      adzuna:
        app-id: ${ADZUNA_APP_ID:}
        app-key: ${ADZUNA_APP_KEY:}
      jsearch:
        api-key: ${JSEARCH_RAPIDAPI_KEY:}

  embeddings:
    # The pinned embedding space (docs/adr/0022-embeddings-pipeline.md). ai-service must use the same two values;
    # the dimension must also match the vector(n) columns of V19. Changing the model makes every stored vector stale.
    model: ${EMBEDDING_MODEL:voyage-4}
    dimension: ${EMBEDDING_DIMENSION:1024}

  billing:
    # The AI usage ledger and the per-user daily cap (docs/adr/0025-ai-usage-ledger.md). The cap is the most credits
    # one user's AI calls may consume per UTC day (0 turns it off); a credit stands for micro-usd-per-credit
    # millionths of a dollar (1000: a tenth of a cent), so the default cap is $0.50 a day per user.
    daily-cap-credits: ${AI_DAILY_CAP_CREDITS:500}
    micro-usd-per-credit: ${AI_MICRO_USD_PER_CREDIT:1000}
    # Plans, credits and payments (docs/adr/0036-plans-credits-and-payments.md). Every amount, price, provider plan id,
    # key and secret is configuration. THE VALUES BELOW ARE PLACEHOLDERS: a price of 100 minor units and ids that start
    # with PLACEHOLDER are obviously fake on purpose; set the real ones per environment (BILLING_PRICE_*_MINOR,
    # STRIPE_PRICE_PRO_USD, PAYSTACK_PLAN_PRO_NGN). Under the prod profile the application refuses to start when a
    # provider has a key and any of its prices is still a placeholder (BillingPriceGuard). Secrets have no default:
    # a provider without its keys is simply not offered.
    # Unused plan credits expire when the next grant arrives, except up to this many (0: no rollover). Top-ups never expire.
    rollover-cap-credits: ${BILLING_ROLLOVER_CAP_CREDITS:0}
    # A past-due subscription (and an active one whose renewal never showed up) goes back to Free after this long.
    grace-period: ${BILLING_GRACE_PERIOD:3d}
    jobs:
      enabled: ${BILLING_JOBS_ENABLED:true}
      free-grant-cron: "0 10 0 * * *"
      expiry-cron: "0 0 * * * *"
    checkout:
      return-url: ${BILLING_RETURN_URL:http://localhost:3000/billing/return}
      cancel-url: ${BILLING_CANCEL_URL:http://localhost:3000/billing/return?canceled=1}
    webhooks:
      # An unmatchable payment event older than this is acknowledged (200) instead of asking for a retry (503).
      unmatched-event-max-age: ${BILLING_WEBHOOK_UNMATCHED_MAX_AGE:24h}
    limits:
      checkout-per-hour: 10
      cancel-per-hour: 10
    plans:
      free:
        # monthly-credits: set to override the seeded value (300) for the free plan
        prices: {}
      pro:
        # monthly-credits: set to override the seeded value (6000)
        prices:
          USD:
            provider: STRIPE
            amount-minor: ${BILLING_PRICE_PRO_USD_MINOR:100}
            provider-plan-id: ${STRIPE_PRICE_PRO_USD:price_PLACEHOLDER_pro_usd}
          NGN:
            provider: PAYSTACK
            amount-minor: ${BILLING_PRICE_PRO_NGN_MINOR:100}
            provider-plan-id: ${PAYSTACK_PLAN_PRO_NGN:PLN_PLACEHOLDER_pro_ngn}
    packs:
      - id: pack_small
        name: Small credit pack
        credits: 2000
        prices:
          USD: { provider: STRIPE, amount-minor: "${BILLING_PRICE_PACK_SMALL_USD_MINOR:100}" }
          NGN: { provider: PAYSTACK, amount-minor: "${BILLING_PRICE_PACK_SMALL_NGN_MINOR:100}" }
      - id: pack_large
        name: Large credit pack
        credits: 10000
        prices:
          USD: { provider: STRIPE, amount-minor: "${BILLING_PRICE_PACK_LARGE_USD_MINOR:100}" }
          NGN: { provider: PAYSTACK, amount-minor: "${BILLING_PRICE_PACK_LARGE_NGN_MINOR:100}" }
    stripe:
      api-base: https://api.stripe.com
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    paystack:
      api-base: https://api.paystack.co
      secret-key: ${PAYSTACK_SECRET_KEY:}

  matching:
    # The matching engine (docs/adr/0026-matching-engine.md). The prompt version is part of the score cache key and is
    # sent to ai-service with every request.
    prompt-version: ${MATCHING_PROMPT_VERSION:match_scoring/v1}
    # Stage 2 recalls this many jobs by embedding similarity; stage 3 has the model re-rank the best rerank-top.
    recall-limit: 300
    rerank-top: 30
    # The stage-2 blend. Each between 0 and 1 and together exactly 1 (startup fails otherwise).
    weights:
      vector: 0.6
      skills: 0.3
      recency: 0.1
    # The age at which a job's recency component halves.
    recency-half-life: 21d
    # Seniority steps either side of the candidate's own that stage 1 allows (5 or more allows every level).
    seniority-band: 1
    llm:
      # Jobs per request to ai-service, and the description length that is hashed and sent.
      batch-size: 10
      description-chars: 3000
      connect-timeout: 2s
      read-timeout: 120s
    retention:
      superseded-after: 14d
      max-age: 90d
    batch:
      # The nightly run for active users (signed in within active-within, with a parsed primary resume, saved
      # preferences and a resume embedding). Off with MATCHING_BATCH_ENABLED=false.
      enabled: ${MATCHING_BATCH_ENABLED:true}
      cron: ${MATCHING_BATCH_CRON:0 30 2 * * *}
      zone: UTC
      active-within: 14d
      max-users-per-run: 500
      max-ai-requests-per-run: 3000
      user-page-size: 100
      lock-at-most-for: 2h

  documents:
    # Resume tailoring (docs/adr/0029-resume-tailoring.md). The prompt version is sent to ai-service with every request and
    # stored with every draft; changing it means a new prompt file in ai-service.
    prompt-version: ${TAILORING_PROMPT_VERSION:tailor_resume/v1}
    # Cover letters and screening answers (docs/adr/0031-cover-letters-and-application-pack.md), same rules.
    letter-prompt-version: ${COVER_LETTER_PROMPT_VERSION:cover_letter/v1}
    answers-prompt-version: ${SCREENING_ANSWERS_PROMPT_VERSION:screening_answers/v1}
    tailoring:
      connect-timeout: 2s
      # One strong-model call that writes a whole resume.
      read-timeout: 120s
      description-chars: 20000
      # A GENERATING draft this old belongs to a request that died; the next request replaces it.
      generation-timeout: 5m
    fact-check:
      connect-timeout: 2s
      read-timeout: 15s

  rendering:
    # Resume export to PDF and DOCX (docs/adr/0030-document-rendering.md). How long the pre-signed download link of a
    # rendered file works; the files themselves live in the app.storage bucket under renders/<user id>/.
    download-url-ttl: 5m

  feed:
    # The "For you" feed (docs/adr/0027-feed-and-feedback.md): ranks and pages through the user's best pool-size matches.
    pool-size: 100
    # Saves, hides and applications move jobs by company and title similarity. Points are added to the 0 to 100 match
    # score (hidden subtracts), scaled by age (half-life) and, for titles, by the Jaccard similarity of the normalized
    # words (at least title-threshold). Penalties and boosts are each capped, so feedback reorders but never empties.
    feedback:
      window: 90d
      half-life: 30d
      max-signals-per-action: 100
      title-threshold: 0.5
      hidden-company: 15
      hidden-title: 15
      saved-company: 5
      saved-title: 6
      applied-company: 4
      applied-title: 5
      max-penalty: 30
      max-boost: 15

  notifications:
    # Saved searches, digests, instant alerts and unsubscribe links (docs/adr/0028-notifications.md). Every email is
    # optional mail: sent only to active, verified users who asked for it, with a one-click unsubscribe link.
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}
    # Where a mail client can reach core-api for the RFC 8058 one-click POST; blank = the web app's /api/core proxy.
    public-api-url: ${NOTIFICATIONS_PUBLIC_API_URL:}
    mail-from: ${NOTIFICATIONS_MAIL_FROM:no-reply@jobfinder.local}
    # Signs unsubscribe tokens (at least 32 characters). Blank derives a key from JWT_SECRET.
    unsubscribe-secret: ${NOTIFICATIONS_UNSUBSCRIBE_SECRET:}
    max-saved-searches: 20
    unsubscribe-token-ttl: 730d
    # Jobs stored within this long of a run are left to the next one (an ingestion transaction may still be committing).
    settle-delay: 2m
    digest:
      # Off with NOTIFICATIONS_DIGEST_ENABLED=false. Runs hourly at minute 5 and sends the digests whose hour (in the
      # user's time zone) has come; one later than max-lateness is skipped rather than sent late.
      enabled: ${NOTIFICATIONS_DIGEST_ENABLED:true}
      cron: ${NOTIFICATIONS_DIGEST_CRON:0 5 * * * *}
      zone: UTC
      max-items: 10
      # The lowest feed score (0 to 100) of a "strong" match, and how long ago the model may have scored it.
      min-score: 70
      lookback: 14d
      max-lateness: 6h
      user-page-size: 200
      lock-at-most-for: 30m
    instant:
      # Off with NOTIFICATIONS_INSTANT_ENABLED=false (no match alerts, no INSTANT saved-search polling).
      enabled: ${NOTIFICATIONS_INSTANT_ENABLED:true}
      poll-interval: 10m
      # At most this many alert emails per user in any 24 hours, each listing at most max-items-per-alert jobs.
      max-per-day: 3
      max-items-per-alert: 5
      lookback: 36h
      lock-at-most-for: 10m
    delivery:
      # A failed email is retried (waiting initial-backoff, then doubling) up to max-attempts in all, while its window is
      # open. Log rows older than log-retention are deleted.
      max-attempts: 3
      initial-backoff: 15m
      stale-after: 30m
      log-retention: 180d

  applications:
    # The application tracker (docs/adr/0032-application-tracker.md): applications, their status history, reminders and the
    # AI follow-up email draft.
    max-per-user: 2000
    reminders:
      # Off with APPLICATION_REMINDERS_ENABLED=false. Every poll-interval it sends the reminders that are due (at most
      # batch-size at a time), under a ShedLock lock; exactly-once is the claim in the reminders table, not the lock.
      enabled: ${APPLICATION_REMINDERS_ENABLED:true}
      poll-interval: 5m
      initial-delay: 1m
      batch-size: 100
      # A failed send is tried again after retry-after, up to max-attempts in all, then the reminder is cancelled.
      max-attempts: 3
      retry-after: 15m
      lock-at-most-for: 10m
      max-pending-per-application: 20
      max-horizon: 366d
    follow-up:
      # Sent to ai-service with every request and recorded with every metered call; changing it means a new prompt file there.
      prompt-version: ${FOLLOW_UP_PROMPT_VERSION:follow_up_email/v1}
      connect-timeout: 2s
      read-timeout: 60s
      description-chars: 20000

  interview:
    # Interview prep (docs/adr/0033-interview-prep.md). The prompt version is sent to ai-service with every request, recorded
    # with every metered call and part of the idempotency key (user, job, prompt version): changing it means a new prompt
    # file there, and a new prep for jobs that already have one.
    prompt-version: ${INTERVIEW_PROMPT_VERSION:interview/v1}
    question-count: 12
    description-chars: 20000
    connect-timeout: 2s
    # Two model calls, one after the other: the questions, then the company brief.
    read-timeout: 150s
    # ai-service's overall deadline for one prep request (its INTERVIEW_PREP_DEADLINE_SECONDS; whole seconds). It must stay
    # at least 5s below read-timeout, which is checked at startup: past it ai-service cancels its calls and answers with the
    # usage of the ones that completed, and that answer has to arrive before we stop waiting.
    ai-deadline: ${INTERVIEW_PREP_DEADLINE_SECONDS:120}s
    # A GENERATING placeholder this old belongs to a request that died; the next request replaces it.
    generation-timeout: 5m
    mock:
      # Text mock interview (docs/adr/0034-mock-interview.md). The prompt version is sent to ai-service with every request
      # and recorded with every metered call.
      prompt-version: ${MOCK_INTERVIEW_PROMPT_VERSION:mock_interview/v1}
      # Hard per-session limits: questions per session (a request may ask for fewer), characters per answer.
      max-turns: ${MOCK_INTERVIEW_MAX_TURNS:8}
      max-answer-chars: ${MOCK_INTERVIEW_MAX_ANSWER_CHARS:4000}
      # An ACTIVE session with no activity for this long becomes ABANDONED and cannot be resumed.
      abandon-after: 24h
      # One ai-service call; the in-flight slot of a session (an answer, or the completion) is replaced after the timeout
      # if its holder died, so it must cover a turn call and a summary call.
      connect-timeout: 2s
      read-timeout: 90s
      # ai-service's overall deadline for one turn or summary request (its MOCK_INTERVIEW_DEADLINE_SECONDS; whole seconds),
      # at least 5s below read-timeout (checked at startup), for the same reason as above.
      ai-deadline: ${MOCK_INTERVIEW_DEADLINE_SECONDS:75}s
      in-flight-timeout: 4m

springdoc:
  # The service-to-service endpoints (service token, not user tokens) are not part of the public API.
  paths-to-exclude: /internal/**
  # Include actuator endpoints (health) in /v3/api-docs so the web client is generated for them.
  show-actuator: true

management:
  health:
    # The mail server is not a reason to take the API out of rotation.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
