name: core-api

on:
  push:
    branches: [main]
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api.yml"
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/core-api/pom.xml

      # Testcontainers uses the runner's Docker daemon.
      - name: Test
        run: ./mvnw -B -ntp test
