name: security

# Secret and dependency scans (ADR 0037). Blocking where a failure always means an action: a leaked secret, a HIGH or
# CRITICAL advisory in something that ships (Maven runtime and test scope, npm production dependencies, ai-service
# dependencies). Not blocking: the npm audit of development-only tooling, which can report advisories that have no fixed
# version yet and never reach a running service; it is printed for review. Also runs weekly so a new advisory is seen
# without a code change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history and working tree)
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner .
          ./gitleaks dir --config .gitleaks.toml --redact --no-banner .

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Production dependencies (blocking at high)
        run: npm audit --omit=dev --audit-level=high
      - name: Development tooling (informational)
        run: npm audit || true

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: pip-audit over the locked dependencies (blocking)
        run: |
          uv export --frozen --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --no-deps --disable-pip --progress-spinner off

  maven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/core-api/pom.xml
      - name: OSV scan of the resolved dependencies (blocking at high)
        working-directory: services/core-api
        run: |
          ./mvnw -B -ntp -q dependency:list -DoutputFile=/tmp/maven-deps.txt -DappendOutput=false
          python3 ../../infra/security/osv_maven_scan.py /tmp/maven-deps.txt
