<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JobFinder autofill</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>JobFinder autofill</h1>
      <p id="status" role="status" aria-live="polite"></p>

      <form id="login" hidden>
        <label>Email <input id="email" type="email" autocomplete="username" required /></label>
        <label>Password <input id="password" type="password" autocomplete="current-password" required /></label>
        <button id="sign-in" type="submit" class="primary">Sign in</button>
      </form>

      <section id="signed-in" hidden>
        <p>Signed in as <strong id="who"></strong></p>
        <button id="fill" type="button" class="primary">Fill from JobFinder</button>
        <button id="sign-out" type="button">Sign out</button>
      </section>

      <p class="note">
        Works on Greenhouse, Lever, Ashby and Workday application pages. It never submits a form: you review it and press
        submit yourself.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
