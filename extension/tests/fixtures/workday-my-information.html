<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Backend Engineer - Example Corp Careers</title>
  <!-- Synthetic fixture shaped like the "My Information" step of a Workday application. No real company or person. -->
</head>
<body>
<div data-automation-id="applyFlowMyInfoPage">
  <h2>My Information</h2>
  <div data-automation-id="formField-source">
    <label for="source--source">How Did You Hear About Us?</label>
    <input id="source--source" data-automation-id="source" type="text">
  </div>
  <div data-automation-id="formField-legalName--firstName">
    <label for="name--legalName--firstName">Given Name(s) <abbr>*</abbr></label>
    <input id="name--legalName--firstName" data-automation-id="legalNameSection_firstName" type="text">
  </div>
  <div data-automation-id="formField-legalName--lastName">
    <label for="name--legalName--lastName">Family Name <abbr>*</abbr></label>
    <input id="name--legalName--lastName" data-automation-id="legalNameSection_lastName" type="text">
  </div>
  <div>
    <label for="address--addressLine1">Address Line 1 <abbr>*</abbr></label>
    <input id="address--addressLine1" data-automation-id="addressSection_addressLine1" type="text">
  </div>
  <div>
    <label for="address--city">City <abbr>*</abbr></label>
    <input id="address--city" data-automation-id="addressSection_city" type="text">
  </div>
  <div>
    <label for="address--postalCode">Postal Code</label>
    <input id="address--postalCode" data-automation-id="addressSection_postalCode" type="text">
  </div>
  <div>
    <label for="contactInformation--emailAddress">Email Address</label>
    <input id="contactInformation--emailAddress" data-automation-id="email" type="text">
  </div>
  <div>
    <label for="phone--phoneNumber">Phone Number <abbr>*</abbr></label>
    <input id="phone--phoneNumber" data-automation-id="phone-number" type="text">
  </div>
  <div>
    <label for="phone--extension">Phone Extension</label>
    <input id="phone--extension" data-automation-id="phone-extension" type="text">
  </div>
  <div>
    <label for="gender">Gender</label>
    <input id="gender" data-automation-id="gender" type="text">
  </div>
  <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
</div>
</body>
</html>
