<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Job Application for Backend Engineer at Example Corp</title>
  <!-- Synthetic fixture shaped like a Greenhouse hosted application form. No real company or person. -->
</head>
<body>
<div id="main">
  <h1 class="app-title">Backend Engineer</h1>
  <div class="company-name">Example Corp</div>
  <form id="application_form" action="https://boards.greenhouse.io/exampleco/jobs/4012345" method="post" novalidate>
    <input type="hidden" name="authenticity_token" value="synthetic-token">
    <input type="hidden" name="job_application[job_id]" value="4012345">

    <div class="field">
      <label for="first_name">First Name <span aria-hidden="true">*</span></label>
      <input id="first_name" name="job_application[first_name]" type="text" autocomplete="given-name" required>
    </div>
    <div class="field">
      <label for="last_name">Last Name <span aria-hidden="true">*</span></label>
      <input id="last_name" name="job_application[last_name]" type="text" autocomplete="family-name" required>
    </div>
    <div class="field">
      <label for="preferred_name">Preferred First Name</label>
      <input id="preferred_name" name="job_application[preferred_name]" type="text">
    </div>
    <div class="field">
      <label for="email">Email <span aria-hidden="true">*</span></label>
      <input id="email" name="job_application[email]" type="email" autocomplete="email" required>
    </div>
    <div class="field">
      <label for="phone">Phone</label>
      <input id="phone" name="job_application[phone]" type="tel" autocomplete="tel">
    </div>
    <div class="field">
      <label for="job_application_location">Location (City)</label>
      <input id="job_application_location" name="job_application[location]" type="text">
    </div>

    <div id="resume_fieldset" class="field">
      <label class="upload-label" for="resume">Resume/CV <span aria-hidden="true">*</span></label>
      <div class="attach">
        <button type="button" class="attach-button">Attach</button>
        <input id="resume" name="job_application[resume]" type="file" accept=".pdf,.doc,.docx"
               style="position:absolute;opacity:0;width:1px;height:1px">
      </div>
    </div>
    <div id="cover_letter_fieldset" class="field">
      <label class="upload-label" for="cover_letter">Cover Letter</label>
      <div class="attach">
        <button type="button" class="attach-button">Attach</button>
        <input id="cover_letter" name="job_application[cover_letter]" type="file"
               style="position:absolute;opacity:0;width:1px;height:1px">
      </div>
      <label for="cover_letter_text">Or enter manually</label>
      <textarea id="cover_letter_text" name="job_application[cover_letter_text]" aria-label="Cover Letter"></textarea>
    </div>

    <div class="field">
      <label for="question_1001">LinkedIn Profile</label>
      <input id="question_1001" name="job_application[answers_attributes][0][text_value]" type="text">
    </div>
    <div class="field">
      <label for="question_1002">Website</label>
      <input id="question_1002" name="job_application[answers_attributes][1][text_value]" type="text">
    </div>
    <div class="field">
      <label for="question_1003">GitHub URL</label>
      <input id="question_1003" name="job_application[answers_attributes][2][text_value]" type="text">
    </div>
    <div class="field">
      <label for="question_1004">Why do you want to work at Example Corp?</label>
      <textarea id="question_1004" name="job_application[answers_attributes][3][text_value]"></textarea>
    </div>
    <div class="field">
      <label for="question_1005">What are your salary expectations?</label>
      <input id="question_1005" name="job_application[answers_attributes][4][text_value]" type="text">
    </div>
    <div class="field">
      <label for="question_1006">Tell us about a project you are proud of.</label>
      <textarea id="question_1006" name="job_application[answers_attributes][5][text_value]"></textarea>
    </div>
    <div class="field">
      <label for="question_1007">Are you legally authorized to work in the country where this job is located?</label>
      <select id="question_1007" name="job_application[answers_attributes][6][boolean_value]">
        <option value="">Please select</option><option value="1">Yes</option><option value="0">No</option>
      </select>
    </div>
    <div class="field">
      <label for="question_1008">Will you now or in the future require sponsorship for employment visa status?</label>
      <select id="question_1008" name="job_application[answers_attributes][7][boolean_value]">
        <option value="">Please select</option><option value="1">Yes</option><option value="0">No</option>
      </select>
    </div>
    <div class="field">
      <label for="question_1009">How did you hear about this job?</label>
      <input id="question_1009" name="job_application[answers_attributes][8][text_value]" type="text">
    </div>

    <div id="eeoc_fields">
      <h3>U.S. Equal Employment Opportunity Information (Completion is voluntary)</h3>
      <div class="field">
        <label for="job_application_gender">Gender</label>
        <select id="job_application_gender" name="job_application[gender]"><option value="">Please select</option><option value="1">Female</option><option value="2">Male</option></select>
      </div>
      <div class="field">
        <label for="job_application_hispanic_ethnicity">Are you Hispanic/Latino?</label>
        <select id="job_application_hispanic_ethnicity" name="job_application[hispanic_ethnicity]"><option value="">Please select</option><option value="1">Yes</option><option value="2">No</option></select>
      </div>
      <div class="field">
        <label for="job_application_race">Race</label>
        <select id="job_application_race" name="job_application[race]"><option value="">Please select</option><option value="1">Asian</option></select>
      </div>
      <div class="field">
        <label for="job_application_veteran_status">Veteran Status</label>
        <select id="job_application_veteran_status" name="job_application[veteran_status]"><option value="">Please select</option><option value="1">I am not a protected veteran</option></select>
      </div>
      <fieldset class="field">
        <legend>Disability Status</legend>
        <label><input type="radio" name="job_application[disability_status]" value="1"> Yes, I have a disability</label>
        <label><input type="radio" name="job_application[disability_status]" value="2"> No, I do not have a disability</label>
        <label><input type="radio" name="job_application[disability_status]" value="3"> I do not want to answer</label>
      </fieldset>
    </div>

    <div class="field">
      <label><input type="checkbox" name="job_application[consent]" value="1"> I have read and agree to the Privacy Policy</label>
    </div>

    <div style="display:none" aria-hidden="true">
      <label for="website_url_hp">Leave this empty</label>
      <input id="website_url_hp" name="website_url" type="text" tabindex="-1" autocomplete="off">
    </div>
    <div class="h-captcha">
      <input id="captcha_answer" name="captcha_answer" type="text" aria-label="Type the characters you see">
    </div>

    <input id="submit_app" type="submit" value="Submit Application">
  </form>
</div>
<script>
  window.__submitCount = 0;
  window.__submitClicks = 0;
  document.getElementById("application_form").addEventListener("submit", function (event) {
    event.preventDefault();
    window.__submitCount += 1;
  });
  document.getElementById("submit_app").addEventListener("click", function () {
    window.__submitClicks += 1;
  });
</script>
</body>
</html>
